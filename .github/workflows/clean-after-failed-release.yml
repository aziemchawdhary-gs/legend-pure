# This action deletes one explicitly named tag after a failed release.
# With publish-before-tag ordering (publish -> tag -> bump), a failed release
# normally fails before the tag is ever created or pushed, so there is usually
# no tag to clean up at all. When a tag does need removing — e.g. it was
# pushed but the release must still be abandoned — the operator must name it
# explicitly; this workflow never guesses which tag is "latest", since the
# newest tag in the repo is ordinarily the last GOOD release, not a stray one.
name: Clean repo after failed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact tag to delete, e.g. legend-pure-5.91.0"
        required: true

jobs:
  clean-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.FINOS_GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.email "37706051+finos-admin@users.noreply.github.com"
          git config --global user.name "FINOS Administrator"

      - name: Delete tag
        run: git push --delete origin "${{ github.event.inputs.tag }}"
